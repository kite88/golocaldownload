name: release

# 推送到 v* 或 日期式标签（如 25.07.07.00）时，自动交叉编译全部平台产物并创建
# GitHub Release：
#
#   git tag 25.07.07.01 && git push origin 25.07.07.01
#
# 流程先跑 go vet 与单元测试，再用 sha256sum -c 自检产物，任一步失败都不会发版。
# 带后缀的标签（如 25.07.07.01-rc1）会被标记为 prerelease，不会占用 Latest。
#
# Release 创建成功后，还会构建并推送多架构 Docker 镜像到 Docker Hub 与阿里云容器镜像服务。
# 需要在仓库 Settings → Secrets and variables → Actions 里按需配置（都配则双推，只配一组也行）：
#
#   DOCKERHUB_USERNAME         Docker Hub 用户名
#   DOCKERHUB_TOKEN            Docker Hub Access Token（权限选 Read & Write）
#   ALIYUN_REGISTRY_USERNAME   阿里云容器镜像服务的镜像仓库登录用户名
#   ALIYUN_REGISTRY_PASSWORD   ACR 控制台里设置的「镜像仓库固定密码」
#
# 两组凭据都没配置时，镜像 job 会打出告警并跳过，不影响 Release 的创建。

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write # gh release create 需要写权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 取全量历史与 tag：否则浅克隆里没有标签，git describe 取不到版本号
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test ./...

      - name: 交叉编译全部平台
        env:
          # 直接把标签名当版本号注入，避免依赖 git describe
          GLD_VERSION: ${{ github.ref_name }}
        run: ./build.sh

      - name: 校验产物
        working-directory: dist
        run: sha256sum -c checksums.txt

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease=(--prerelease) ;;
          esac

          # 幂等：Release 已存在时只覆盖同名产物。这样镜像 job 推送失败后可以直接
          # re-run 整个 workflow 重试，否则会先卡在 gh release create 的「已存在」错误上。
          # 注意产物列表不要加引号，通配展开要交给 shell 做。
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，更新产物"
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Windows 用户下载 .zip，Linux / macOS / FreeBSD 用户下载 .tar.gz；解压后即为短名的 golocaldownload 可执行文件（tar.gz 已带 0755 权限，无需 chmod），直接运行即可，下载库目录会在程序启动时自动创建。checksums.txt 是全部归档的 SHA256，可用 sha256sum -c 校验。" \
              --generate-notes \
              "${prerelease[@]}" \
              dist/*.zip dist/*.tar.gz dist/checksums.txt
          fi

  # 构建并推送多架构 Docker 镜像到 Docker Hub 与阿里云容器镜像服务。
  # 放在独立 job 里：镜像推送失败不会影响已经创建好的 GitHub Release。
  # 两个仓库各有独立的凭据开关，只配一组也能用。
  docker:
    runs-on: ubuntu-latest
    needs: release
    env:
      # 阿里云镜像仓库地址；换账号 / 地域时改这两行
      ALIYUN_REGISTRY: registry.cn-shenzhen.aliyuncs.com
      ALIYUN_IMAGE: registry.cn-shenzhen.aliyuncs.com/tutudev99/golocaldownload
    steps:
      - uses: actions/checkout@v4

      - name: 检查镜像仓库凭据
        id: creds
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ALI_USER: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALI_PASS: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          images=""

          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            images="${DH_USER}/golocaldownload"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过 Docker Hub"
          fi

          if [ -n "$ALI_USER" ] && [ -n "$ALI_PASS" ]; then
            echo "aliyun=true" >> "$GITHUB_OUTPUT"
            if [ -z "$images" ]; then
              images="$ALIYUN_IMAGE"
            else
              images=$(printf '%s\n%s' "$images" "$ALIYUN_IMAGE")
            fi
          else
            echo "aliyun=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 ALIYUN_REGISTRY_USERNAME / ALIYUN_REGISTRY_PASSWORD，跳过阿里云"
          fi

          # metadata-action 的 images 接受多行列表，逐行对应一个仓库
          if [ -z "$images" ]; then
            echo "::warning::两组镜像仓库凭据都没配置，跳过镜像构建与推送"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            {
              echo "images<<EOF"
              printf '%s\n' "$images"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 QEMU（构建非本机架构需要）
        if: steps.creds.outputs.enabled == 'true'
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        if: steps.creds.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: steps.creds.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录阿里云容器镜像服务
        if: steps.creds.outputs.aliyun == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      # metadata-action 只负责生成 OCI 标签（来源、描述、许可证等）
      - name: 生成 OCI 标签
        if: steps.creds.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.creds.outputs.images }}
          # 关掉自动补 latest 的行为，latest 由下一步显式决定
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag

      # 推送标签自己拼：每个仓库一份版本号标签，latest 只在正式标签（不含 -）时才加。
      # 不用 metadata-action 的 enable 表达式，是因为实测预发布标签下 latest 仍会被加上
      # （运行日志里 image.name 明确带着 latest），改成显式逻辑后行为一眼可见、可本地验证。
      - name: 计算推送标签
        if: steps.creds.outputs.enabled == 'true'
        id: push-tags
        env:
          IMAGES: ${{ steps.creds.outputs.images }}
        run: |
          tags=""
          for repo in $(printf '%s\n' "$IMAGES"); do
            tags="${tags:+$tags,}${repo}:${GITHUB_REF_NAME}"
            case "${GITHUB_REF_NAME}" in
              *-*) ;;                                  # 预发布标签：不动 latest
              *) tags="$tags,${repo}:latest" ;;
            esac
          done
          echo "将推送: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: 构建并推送（linux/amd64 + linux/arm64）
        if: steps.creds.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # 阿里云 ACR（个人版）不认识 BuildKit 生成的证明清单，推送时会整包被拒：
          #   denied: unknown manifest class for application/vnd.oci.empty.v1+json
          # （application/vnd.oci.empty.v1+json 正是证明清单用的空 config 媒体类型）
          # 所以这里必须关掉 provenance / sbom，代价是 Docker Hub 上也不带证明清单了。
          # 若哪天只想给 Docker Hub 带证明清单，需拆成两次构建分别推送。
          provenance: false
          sbom: false
          tags: ${{ steps.push-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GLD_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
