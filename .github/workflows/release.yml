name: release

# 推送到 v* 或 日期式标签（如 25.07.07.00）时，自动交叉编译全部平台产物并创建
# GitHub Release：
#
#   git tag 25.07.07.01 && git push origin 25.07.07.01
#
# 流程先跑 go vet 与单元测试，再用 sha256sum -c 自检产物，任一步失败都不会发版。
# 带后缀的标签（如 25.07.07.01-rc1）会被标记为 prerelease，不会占用 Latest。

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write # gh release create 需要写权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 取全量历史与 tag：否则浅克隆里没有标签，git describe 取不到版本号
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test ./...

      - name: 交叉编译全部平台
        env:
          # 直接把标签名当版本号注入，避免依赖 git describe
          GLD_VERSION: ${{ github.ref_name }}
        run: ./build.sh

      - name: 校验产物
        working-directory: dist
        run: sha256sum -c checksums.txt

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease=(--prerelease) ;;
          esac

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Windows 用户下载 .zip，Linux / macOS / FreeBSD 用户下载 .tar.gz；解压后即为短名的 golocaldownload 可执行文件（tar.gz 已带 0755 权限，无需 chmod），直接运行即可，下载库目录会在程序启动时自动创建。checksums.txt 是全部归档的 SHA256，可用 sha256sum -c 校验。" \
            --generate-notes \
            "${prerelease[@]}" \
            dist/*.zip dist/*.tar.gz dist/checksums.txt
