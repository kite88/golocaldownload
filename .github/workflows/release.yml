name: release

# 推送到 v* 或 日期式标签（如 25.07.07.00）时，自动交叉编译全部平台产物并创建
# GitHub Release：
#
#   git tag 25.07.07.01 && git push origin 25.07.07.01
#
# 流程先跑 go vet 与单元测试，再用 sha256sum -c 自检产物，任一步失败都不会发版。
# 带后缀的标签（如 25.07.07.01-rc1）会被标记为 prerelease，不会占用 Latest。
#
# Release 创建成功后，还会构建并推送多架构 Docker 镜像到 Docker Hub。
# 需要在仓库 Settings → Secrets and variables → Actions 里配置：
#
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub Access Token（权限选 Read & Write）
#
# 未配置时镜像 job 会打出告警并跳过，不影响 Release 的创建。

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write # gh release create 需要写权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 取全量历史与 tag：否则浅克隆里没有标签，git describe 取不到版本号
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test ./...

      - name: 交叉编译全部平台
        env:
          # 直接把标签名当版本号注入，避免依赖 git describe
          GLD_VERSION: ${{ github.ref_name }}
        run: ./build.sh

      - name: 校验产物
        working-directory: dist
        run: sha256sum -c checksums.txt

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease=(--prerelease) ;;
          esac

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Windows 用户下载 .zip，Linux / macOS / FreeBSD 用户下载 .tar.gz；解压后即为短名的 golocaldownload 可执行文件（tar.gz 已带 0755 权限，无需 chmod），直接运行即可，下载库目录会在程序启动时自动创建。checksums.txt 是全部归档的 SHA256，可用 sha256sum -c 校验。" \
            --generate-notes \
            "${prerelease[@]}" \
            dist/*.zip dist/*.tar.gz dist/checksums.txt

  # 构建并推送多架构 Docker 镜像到 Docker Hub。
  # 放在独立 job 里：镜像推送失败不会影响已经创建好的 GitHub Release。
  docker:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Docker Hub 凭据
        id: creds
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过镜像构建与推送"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 QEMU（构建非本机架构需要）
        if: steps.creds.outputs.ok == 'true'
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        if: steps.creds.outputs.ok == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 预发布标签（含 -，如 26.09.28.01-rc1）只打版本号，不覆盖 latest
      - name: 生成镜像标签
        if: steps.creds.outputs.ok == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/golocaldownload
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: 构建并推送（linux/amd64 + linux/arm64）
        if: steps.creds.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GLD_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
