<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>本地文件下载服务</title>
    <link rel="icon" type="image/x-icon" href="/web/static/favicon.ico">
    <script>
        // 主题三态：light / system / dark，存在 localStorage 的 gld-theme 里。
        // 这段必须放在样式表之前、且在首帧之前执行，否则暗色用户会先看到一瞬白屏（FOUC）。
        (function () {
            var mode = 'system';
            try {
                mode = localStorage.getItem('gld-theme') || 'system';
            } catch (e) {
                // 隐私模式等场景下 localStorage 不可用，按跟随系统处理
            }
            var dark = mode === 'dark' ||
                (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        })();
    </script>
    <link rel="stylesheet" href="/web/static/bootstrap/v5.3.5/bootstrap.min.css">
    <style>
        /* 把 Bootstrap 的圆角变量调柔和一点，按钮 / 输入框 / 卡片 / 弹窗会一起变 */
        :root {
            --bs-border-radius: 0.625rem;
        }

        a {
            text-decoration: none;
            cursor: pointer;
        }

        /* 行内操作（下载 / 复制地址）都用文本链接而不是按钮：明确去掉下划线（含悬停态），
           免得和 Bootstrap 自带的链接样式打架 */
        .action-link,
        .action-link:hover,
        .action-link:focus {
            text-decoration: none;
            white-space: nowrap;
        }

        /* 复制成功后文字临时转绿 */
        .copy-link.copied {
            color: var(--bs-success);
        }

        /* 检索弹窗里的操作链接（定位 / 下载 / 复制地址）：间隔统一由容器给，
           免得逐个加外边距时漏掉某一个，几条链接挤在一起 */
        .action-links {
            display: inline-flex;
            gap: 0.5rem;
        }

        /* ---------- 顶部一行：标题 / 搜索框 / 主题 ---------- */
        .page-top {
            max-width: 1280px;
            margin: 0 auto;
            padding: 18px 0 6px;
        }

        .page-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        /* 下载库路径由 index.js 从 res.root_dir 填进来。标题只占左边一列，所以这里限制成
           单行省略号——路径再长也不会把这一行撑高；完整路径挂在 title 上，悬停可见。
           用 flex 是为了让右边的「复制路径」始终可见，被截断的只该是路径本身 */
        .page-subtitle {
            display: flex;
            align-items: baseline;
            gap: 6px;
            min-width: 0;
            color: var(--bs-secondary-color);
            font-size: 0.8125rem;
            margin-top: 3px;
        }

        .page-subtitle #lib-path {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .page-subtitle .copy-link {
            flex: 0 0 auto;
        }

        /* ---------- 面包屑（独立一行） ---------- */
        .toolbar-breadcrumb {
            max-width: 1280px;
            margin: 0 auto;
            padding: 4px 0 12px;
        }

        /* 面包屑层级多、换行时，行与行之间留一点缝 */
        .nav {
            row-gap: 4px;
        }

        .nav > li {
            font-weight: 600;
        }

        .nav > li + li:before {
            color: var(--bs-secondary-color);
            content: "/ ";
            padding: 0 5px;
        }

        /* 搜索框：加长 + 两端胶囊圆角（内侧重合用 shreshold 使左右各自成弧） */
        .search-group {
            width: 100%;
            max-width: 520px;
        }

        .search-group .form-control {
            border-radius: 50rem 0 0 50rem;
            padding-left: 1rem;
        }

        .search-group .btn {
            border-radius: 0 50rem 50rem 0;
            padding-left: 1.15rem;
            padding-right: 1.15rem;
            white-space: nowrap;
        }

        /* 弹窗头部「检索到 N 条记录」：与前面的检索框留一点间隔，别贴着；
           另外条数不折行（窄屏下「检索到 / 3 / 条记录」被拆开很难看） */
        #res-length {
            margin-left: 0.75rem;
            white-space: nowrap;
        }

        /* ---------- 列表卡片 ---------- */
        .list-card {
            max-width: 1280px;
            margin: 0 auto 40px;
            background: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: 0.75rem;
            overflow: hidden;
        }

        .list-card .table {
            margin-bottom: 0;
        }

        .list-card .table > thead th {
            background: var(--bs-tertiary-bg);
            color: var(--bs-secondary-color);
            font-weight: 600;
            white-space: nowrap;
        }

        /* 文件类型图标：Material 图标是 24×24 的 viewBox，这里统一压到 16px 并与文件名基线对齐 */
        .file-icon {
            width: 16px;
            height: 16px;
            margin-right: 6px;
            vertical-align: -3px;
        }

        .cell-center {
            text-align: center;
        }

        /* 命中行底色 / 关键字高亮 / 错误提示：这三个颜色语义特殊（要有足够对比度），
           所以各自给出浅色与深色两套取值。
           .hl 是加在表格单元格上的，而 Bootstrap 的 .table>:not(caption)>*>* 会把每个单元格的
           背景铺成 var(--bs-table-bg)：它和 .hl 权重相同、又定义在样式表里，只写 .hl 的话底色
           会被盖掉（命中行看不出任何变化）。所以这里一并给出 td.hl / th.hl —— 权重与它相同，
           而内联 style 排在 bootstrap 之后，同权重时后来者生效；顺手把 --bs-table-* 变量也改掉，
           给单元格背景留一条变量层面的退路（hover 时那层 box-shadow 是叠加在它之上的） */
        .hl,
        td.hl,
        th.hl {
            --bs-table-bg: #d1c2c2;
            --bs-table-color: #000000;
            background: #d1c2c2;
            color: #000000;
        }

        .kw {
            color: #d63384;
            font-weight: bold;
        }

        .err {
            color: #b02a37;
        }

        [data-bs-theme="dark"] .hl,
        [data-bs-theme="dark"] td.hl,
        [data-bs-theme="dark"] th.hl {
            --bs-table-bg: #4b5563;
            --bs-table-color: #f8f9fa;
            background: #4b5563;
            color: #f8f9fa;
        }

        [data-bs-theme="dark"] .kw {
            color: #ff8fb1;
        }

        [data-bs-theme="dark"] .err {
            color: #ff9aa6;
        }

        .theme-switch .btn,
        .view-switch .btn {
            white-space: nowrap;
        }

        /* ---------- 网格视图 ---------- */
        /* 列表与网格两套 DOM 都留在页面里，由 index.js 用 d-none 切换显示，
           两者共用同一份数据（切换时只重绘，不重新请求接口） */
        .grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.75rem;
            max-width: 1280px;
            margin: 0 auto 40px;
            padding: 1rem;
            background: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: 0.75rem;
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.375rem;
            min-width: 0;
            padding: 0.75rem 0.5rem;
            border: 1px solid var(--bs-border-color);
            border-radius: 0.625rem;
            text-align: center;
        }

        .grid-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.375rem;
            width: 100%;
            min-width: 0;
            color: inherit;
        }

        .grid-icon {
            width: 40px;
            height: 40px;
        }

        /* 名字最多两行，超出省略号；完整名字挂在 title 上，悬停可见 */
        .grid-name {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-all;
            font-size: 0.8125rem;
            line-height: 1.3;
        }

        /* 大小与时间各占一行（原来挤在一行、卡片一窄就溢出）。
           再长的内容也只在本行内省略，不会再顶出卡片 */
        .grid-meta {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--bs-secondary-color);
            font-size: 0.75rem;
        }

        .grid-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;   /* 顶到卡片底部：同一行里目录卡与文件卡的操作链接才会对齐 */
            font-size: 0.8125rem;
        }

        .grid-empty {
            grid-column: 1 / -1;
            padding: 1.5rem 0;
            text-align: center;
            color: var(--bs-secondary-color);
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <!-- 顶部一行：标题（左）/ 搜索框（中）/ 主题切换（右）。
         搜索框靠左右两个对称的列顶到页面正中；小屏时三者竖向堆叠。 -->
    <div class="row align-items-center page-top">
        <div class="col-12 col-lg-3">
            <h1 class="page-title">本地文件下载服务</h1>
            <!-- 路径由 index.js 从 res.root_dir 填进 #lib-path；右边链接用来复制这条路径。
                 列表还没加载出来时先隐藏，避免点到空字符串 -->
            <div class="page-subtitle">
                <span id="lib-path"></span>
                <a id="copy-lib-path" onclick="copyLibPath(this)" class="action-link copy-link"
                   title="复制下载库路径" hidden>复制路径</a>
            </div>
        </div>
        <div class="col-12 col-lg-6 d-flex justify-content-center my-2 my-lg-0">
            <div class="input-group search-group">
                <input id="search-input-text" type="text" class="form-control" placeholder="按文件名 / 目录名检索"
                       aria-label="按文件名或目录名检索">
                <button id="search-open-btn" class="btn btn-primary" type="button">全局检索</button>
            </div>
        </div>
        <div class="col-12 col-lg-3 d-flex flex-wrap gap-2 justify-content-lg-end">
            <!-- 视图切换：列表 / 网格，选择记在浏览器本地（同主题一样） -->
            <div class="btn-group btn-group-sm view-switch" role="group" aria-label="视图切换">
                <button type="button" class="btn btn-outline-secondary" data-view="list">列表</button>
                <button type="button" class="btn btn-outline-secondary" data-view="grid">网格</button>
            </div>
            <!-- 主题切换：亮色 / 跟随系统 / 暗色，选择记在浏览器本地。
                 用「按钮组」而不是下拉框：项目内嵌的是非 bundle 版 bootstrap.min.js，
                 不含 Popper，下拉框与 tooltip 初始化都会抛 _createPopper is not a function。 -->
            <div class="btn-group btn-group-sm theme-switch" role="group" aria-label="主题切换">
                <button type="button" class="btn btn-outline-secondary" data-theme="light">亮色</button>
                <button type="button" class="btn btn-outline-secondary" data-theme="system">跟随系统</button>
                <button type="button" class="btn btn-outline-secondary" data-theme="dark">暗色</button>
            </div>
        </div>
    </div>

    <!-- 面包屑独立成行：路径层级多时整行换行，不会挤在窄栏里折成好几段 -->
    <div class="row toolbar-breadcrumb">
        <div class="col-12">
            <!-- 存放路径同时填在 title 与上面的副标题里，这里用原生 title，不引入 tooltip 组件 -->
            <ul class="nav"></ul>
        </div>
    </div>

    <!-- 列表视图：文件目录 / 大小 / 时间三列 -->
    <div class="list-card">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th scope="col">文件目录</th>
                <th scope="col">大小</th>
                <th scope="col">时间</th>
            </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>

    <!-- 网格视图：默认隐藏，切到网格时由 index.js 去掉 d-none -->
    <div id="grid-view" class="grid-view d-none"></div>
</div>
<!-- Modal：Bootstrap 的 Modal 不依赖 Popper，可以放心用 -->
<div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <div class="input-group search-group">
                    <input id="search-input-text-i" type="text" class="form-control" placeholder="按文件名 / 目录名检索"
                           aria-label="按文件名或目录名检索">
                    <button id="search-get-btn" class="btn btn-primary" type="button">全局检索</button>
                </div>
                <span id="res-length"></span>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div id="search-model-body" class="modal-body"></div>
        </div>
    </div>
</div>
</body>
<script src="/web/static/bootstrap/v5.3.5/bootstrap.min.js"></script>
<script src="/web/static/jquery/jquery-3.7.1.min.js"></script>
<script src="/web/static/assets/js/index.js"></script>
</html>
